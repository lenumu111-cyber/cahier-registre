<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#b4531f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Atelier Couture</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f0;--card:#fff;--ink:#2a2118;--mut:#7a6b5a;--ac:#b4531f;--ln:#e6dccd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#271f18;--ink:#f3eadf;--mut:#b3a28f;--ac:#e0824a;--ln:#3b3025}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#271f18;--ink:#f3eadf;--mut:#b3a28f;--ac:#e0824a;--ln:#3b3025}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
#app{max-width:560px;margin:auto;padding:14px 14px 90px}
h1{font:700 22px Georgia,serif;margin:6px 0 12px}h2{font:700 18px Georgia,serif;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font:600 15px system-ui;cursor:pointer;text-align:center}
.btn.o{background:none;color:var(--ac);border:1.5px solid var(--ac)}.btn.w{background:#1f9d55}.btn.big{width:100%;padding:15px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.steps{display:flex;gap:4px;margin-bottom:14px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.steps i.on{background:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:14px}
.th{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}.big-th{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph div{position:relative}.ph b{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;cursor:pointer}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--ln);color:var(--ink)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;padding:14px 26px}
.fig{background:linear-gradient(var(--card),var(--ln));border-radius:14px;padding:6px}
.load{text-align:center;padding:16px;color:var(--mut)}
</style></head><body><div id="app"></div>
<script>
const G={femme:'Femme',homme:'Homme',garcon:'Garçon',fillette:'Fillette'};
const MS={femme:['Épaule','Poitrine','Taille','Bassin','Longueur haut','Longueur robe','Manche','Tour de bras','Longueur pantalon','Tour de cuisse'],
homme:['Épaule','Poitrine','Taille','Ventre','Longueur haut','Manche','Tour de cou','Longueur pantalon','Tour de cuisse','Bas pantalon'],
garcon:['Épaule','Poitrine','Taille','Longueur haut','Manche','Longueur pantalon','Tour de cuisse'],
fillette:['Épaule','Poitrine','Taille','Bassin','Longueur robe','Manche','Longueur pantalon']};
const DM=[{n:'Boubou',t:'long'},{n:'Tunique',t:'mid'},{n:'Boubou 3 pièces Grand Dakar',t:'three'},{n:'Robe',t:'dress'},{n:'Jupe',t:'skirt'},{n:'Pantalon',t:'pants'}];
const ST=['En cours','Prêt','Livré'];
const SK='atelier-couture-v1';
let db={orders:[],models:[]};
try{const r=localStorage.getItem(SK);if(r)db=JSON.parse(r)}catch(e){}
if(!db.models.length)db.models=DM.slice();
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(db))}catch(e){toast('Mémoire pleine : supprimez d\'anciennes commandes.')}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=document.getElementById('app');
let view='home',step=0,d=null,cur=null,load=false,askDel=false;
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#2a2118;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;max-width:90%';document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const blank=()=>({id:Date.now(),client:'',tel:'',genre:'femme',mes:{},model:'',tissu:'',acc:[],livraison:'',prix:'',avance:'',notes:'',statut:'En cours',date:new Date().toISOString().slice(0,10)});
const fmt=n=>(Number(n)||0).toLocaleString('fr-FR')+' F';
const rd=f=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=fr.result};fr.readAsDataURL(f)});
async function pick(inp,kind){const fs=[...inp.files];if(!fs.length)return;load=true;render();for(const f of fs){const u=await rd(f);kind=='t'?d.tissu=u:d.acc.push(u)}load=false;render()}

function fig(o){
 const t=(db.models.find(m=>m.n==o.model)||{}).t||'mid',g=o.genre;
 const sc={femme:1,homme:1.06,garcon:.82,fillette:.78}[g],w={femme:34,homme:46,garcon:34,fillette:30}[g];
 const L=100-w,R=100+w,f=o.tissu?'url(#fb)':'#c98a5b',sk='#8a5a3c',st='stroke="#0005" stroke-width="1.5"';
 const sl=(len)=>[-1,1].map(s=>`<path d="M${100+s*w} 72L${100+s*(w+len)} ${72+len*1.6}L${100+s*(w+len-14)} ${72+len*1.6+22}L${100+s*(w-2)} 120Z" fill="${f}" ${st}/>`).join('');
 const legs=(y,c)=>`<rect x="82" y="${y}" width="17" height="${345-y}" fill="${c}" ${c==f?st:''}/><rect x="101" y="${y}" width="17" height="${345-y}" fill="${c}" ${c==f?st:''}/>`;
 let gm='';
 if(t=='long')gm=`<path d="M${L} 72H${R}L${R+30} 330H${L-30}Z" fill="${f}" ${st}/>`+sl(52);
 else if(t=='mid')gm=legs(210,'#4a3b2e')+`<path d="M${L} 72H${R}L${R+8} 215H${L-8}Z" fill="${f}" ${st}/>`+sl(30);
 else if(t=='three')gm=legs(180,f)+`<path d="M${L} 72H${R}L${R+20} 285H${L-20}Z" fill="${f}" ${st}/>`+sl(40)+`<path d="M${L+8} 150H${R-8}" stroke="#0006" stroke-width="3"/>`;
 else if(t=='dress')gm=`<path d="M${L+6} 72H${R-6}L${R-10} 140L${R+34} 285H${L-34}L${L+10} 140Z" fill="${f}" ${st}/>`+sl(14);
 else if(t=='skirt')gm=legs(285,sk)+`<path d="M${L+4} 72H${R-4}V150H${L+4}Z" fill="#ddd2c4" ${st}/><path d="M${L+8} 150H${R-8}L${R+30} 285H${L-30}Z" fill="${f}" ${st}/>`;
 else gm=`<path d="M${L+4} 72H${R-4}V150H${L+4}Z" fill="#ddd2c4" ${st}/>`+legs(150,f);
 const body=`<circle cx="100" cy="38" r="18" fill="${sk}"/><rect x="92" y="54" width="16" height="22" fill="${sk}"/><rect x="${L-10}" y="76" width="12" height="95" rx="6" fill="${sk}"/><rect x="${R-2}" y="76" width="12" height="95" rx="6" fill="${sk}"/><rect x="${L}" y="72" width="${2*w}" height="95" rx="14" fill="${sk}"/>${legs(160,sk)}`;
 const pat=o.tissu?`<defs><pattern id="fb" patternUnits="userSpaceOnUse" width="70" height="70"><image href="${o.tissu}" width="70" height="70" preserveAspectRatio="xMidYMid slice"/></pattern></defs>`:'';
 return `<div class="fig"><svg viewBox="0 0 200 360" width="100%" style="max-height:440px">${pat}<g transform="translate(100 345) scale(${sc}) translate(-100 -345)">${body}${gm}</g></svg></div>`}

function render(){
 if(view=='home'){
  const os=db.orders.slice().reverse();
  $.innerHTML=`<h1>🧵 Atelier Couture</h1>`+(os.length?os.map(o=>`<div class="card" onclick="show(${o.id})"><div class="row"><b>${esc(o.client)||'Sans nom'}</b><span class="tag">${o.statut}</span></div><div class="mut">${esc(o.model)} · ${G[o.genre]}${o.livraison?' · livraison '+o.livraison:''}</div>${o.prix?`<div class="mut">Reste : ${fmt(o.prix-o.avance)}</div>`:''}</div>`).join(''):`<div class="card mut">Aucune commande pour l'instant. Appuyez sur « Nouvelle commande ».</div>`)+`<button class="btn fab" onclick="newO()">+ Nouvelle commande</button>`;
 }else if(view=='new'){
  const names=[...new Set(db.orders.map(o=>o.client))].map(n=>`<option value="${esc(n)}">`).join('');
  const T=['Client','Mesures','Modèle','Tissu','Accessoires','Livraison'];
  let b='';
  if(step==0)b=`<h2>Client et genre</h2><label>Nom du client</label><input list="cl" value="${esc(d.client)}" oninput="d.client=this.value" onchange="known(this.value)" placeholder="Nom"><datalist id="cl">${names}</datalist><label>Téléphone (WhatsApp)</label><input type="tel" value="${esc(d.tel)}" oninput="d.tel=this.value" placeholder="221 77 000 00 00"><label>Genre</label><div class="chips">${Object.keys(G).map(k=>`<button class="chip ${d.genre==k?'on':''}" onclick="d.genre='${k}';render()">${G[k]}</button>`).join('')}</div>`;
  if(step==1)b=`<h2>Mesures (cm)</h2><div class="g2">${MS[d.genre].map(m=>`<div><label>${m}</label><input type="number" inputmode="decimal" value="${esc(d.mes[m])}" oninput="d.mes['${m}']=this.value"></div>`).join('')}</div>`;
  if(step==2)b=`<h2>Modèle</h2><div class="chips">${db.models.map(m=>`<button class="chip ${d.model==m.n?'on':''}" onclick="d.model=this.dataset.n;render()" data-n="${esc(m.n)}">${esc(m.n)}</button>`).join('')}</div><label>Ajouter un modèle à la liste</label><input id="nm" placeholder="Ex : Grand boubou brodé"><select id="nt"><option value="long">Long (type boubou)</option><option value="mid">Haut court (type tunique)</option><option value="three">3 pièces</option><option value="dress">Robe</option><option value="skirt">Jupe</option><option value="pants">Pantalon</option></select><button class="btn o" onclick="addM()">Ajouter</button>`;
  if(step==3)b=`<h2>Photo du tissu</h2>${load?'<div class="load">⏳ Chargement…</div>':d.tissu?`<img class="big-th" src="${d.tissu}">`:'<div class="mut">Aucune photo.</div>'}<p><label class="btn big" style="display:block;color:#fff">📷 ${d.tissu?'Reprendre':'Prendre'} la photo<input type="file" accept="image/*" capture="environment" hidden onchange="pick(this,'t')"></label></p>`;
  if(step==4)b=`<h2>Accessoires</h2><div class="ph">${d.acc.map((a,i)=>`<div><img class="th" src="${a}"><b onclick="d.acc.splice(${i},1);render()">×</b></div>`).join('')}</div>${load?'<div class="load">⏳ Chargement…</div>':''}<p><label class="btn big" style="display:block;color:#fff">📷 Ajouter une photo<input type="file" accept="image/*" capture="environment" hidden onchange="pick(this,'a')"></label></p><div class="mut">Boutons, fermetures, fils, doublure…</div>`;
  if(step==5)b=`<h2>Livraison et paiement</h2><label>Date de livraison</label><input type="date" value="${d.livraison}" oninput="d.livraison=this.value"><div class="g2"><div><label>Prix (F CFA)</label><input type="number" inputmode="numeric" value="${esc(d.prix)}" oninput="d.prix=this.value"></div><div><label>Avance (F CFA)</label><input type="number" inputmode="numeric" value="${esc(d.avance)}" oninput="d.avance=this.value"></div></div><label>Notes</label><textarea rows="3" oninput="d.notes=this.value">${esc(d.notes)}</textarea><button class="btn big" onclick="gen()">✨ Générer le modèle</button>`;
  $.innerHTML=`<div class="row"><h1>Nouvelle commande</h1><button class="chip" onclick="view='home';render()">✕</button></div><div class="steps">${T.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div class="mut" style="margin-bottom:8px">Étape ${step+1}/6 · ${T[step]}</div><div class="card">${b}</div><div class="row">${step?`<button class="btn o" onclick="step--;render()">← Retour</button>`:'<span></span>'}${step<5?`<button class="btn" onclick="step++;render()">Suivant →</button>`:''}</div>`;
 }else{
  const o=cur,mk=MS[o.genre].filter(m=>o.mes[m]);
  $.innerHTML=`<div class="row"><h1>Aperçu · ${esc(o.client)||'Client'}</h1><button class="chip" onclick="view='home';render()">✕</button></div>${fig(o)}
  <div class="card" style="margin-top:12px"><div class="row"><b>${esc(o.model)||'Modèle'} · ${G[o.genre]}</b></div>${o.livraison?`<div class="mut">Livraison : ${o.livraison}</div>`:''}
  <label>Statut</label><div class="chips">${ST.map(s=>`<button class="chip ${o.statut==s?'on':''}" onclick="cur.statut='${s}';save();render()">${s}</button>`).join('')}</div>
  ${o.prix?`<div>Prix ${fmt(o.prix)} · Avance ${fmt(o.avance)} · <b>Reste ${fmt(o.prix-o.avance)}</b></div>`:''}</div>
  ${o.tissu||o.acc.length?`<div class="card"><label>Tissu et accessoires</label><div class="ph">${o.tissu?`<img class="th" src="${o.tissu}">`:''}${o.acc.map(a=>`<img class="th" src="${a}">`).join('')}</div></div>`:''}
  ${mk.length?`<div class="card"><label>Mesures</label><div class="g2">${mk.map(m=>`<div>${m} : <b>${esc(o.mes[m])} cm</b></div>`).join('')}</div></div>`:''}
  ${o.notes?`<div class="card mut">${esc(o.notes)}</div>`:''}
  <p><button class="btn w big" onclick="wa()">Envoyer sur WhatsApp</button></p>
  <p class="row"><button class="btn o" onclick="again()">Nouvelle commande, même client</button>${askDel?'':'<button class="btn o" onclick="askDel=true;render()">Supprimer</button>'}</p>${askDel?`<div class="card"><b>Supprimer cette commande ?</b><div class="row" style="margin-top:10px"><button class="btn o" onclick="askDel=false;render()">Annuler</button><button class="btn" style="background:#c0392b" onclick="del()">Oui, supprimer</button></div></div>`:''}`;
 }
}
function newO(){d=blank();step=0;view='new';render()}
function known(n){const o=db.orders.slice().reverse().find(x=>x.client==n);if(o){d.tel=o.tel;d.genre=o.genre;d.mes=Object.assign({},o.mes);render()}}
function addM(){const n=document.getElementById('nm').value.trim();if(!n)return;db.models.push({n,t:document.getElementById('nt').value});d.model=n;save();render()}
function gen(){if(!d.client.trim()){toast('Entrez le nom du client (étape 1).');return}if(!d.model){toast('Choisissez un modèle (étape 3).');return}db.orders.push(d);save();cur=d;view='show';render()}
function show(id){askDel=false;cur=db.orders.find(o=>o.id==id);view='show';render()}
function again(){const o=cur;d=blank();d.client=o.client;d.tel=o.tel;d.genre=o.genre;d.mes=Object.assign({},o.mes);step=2;view='new';render()}
function del(){db.orders=db.orders.filter(o=>o.id!=cur.id);save();askDel=false;view='home';render()}
function wa(){const o=cur;let t=`*Commande couture*\nClient : ${o.client}\nModèle : ${o.model} (${G[o.genre]})\n`;MS[o.genre].forEach(m=>{if(o.mes[m])t+=`${m} : ${o.mes[m]} cm\n`});if(o.livraison)t+=`Livraison : ${o.livraison}\n`;if(o.prix)t+=`Prix ${fmt(o.prix)}, avance ${fmt(o.avance)}, reste ${fmt(o.prix-o.avance)}\n`;t+=`Statut : ${o.statut}`;const n=(o.tel||'').replace(/\D/g,'');window.open(`https://wa.me/${n}?text=${encodeURIComponent(t)}`,'_blank')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const PUB={"kty":"EC","crv":"P-256","x":"u5Ahl-DDFZ4EX6b2GYmnZpL8w4JNFcf1GLj94Q5-Qjw","y":"-hdUFgwvEEatgk5Pslmq-EchrdzpBKAE9v28MGD1Hgc"};
const OWNER_TEL='221000000000'; // REMPLACEZ par votre numéro WhatsApp (indicatif + numéro, sans +)
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
function devId(){let i=null;try{i=localStorage.getItem('ac-dev')}catch(e){}if(!i){const a=crypto.getRandomValues(new Uint8Array(4));i=[...a].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase().replace(/(.{4})/,'$1-');try{localStorage.setItem('ac-dev',i)}catch(e){}}return i}
async function check(k){try{const[p,s]=k.trim().split('.');const pl=new TextDecoder().decode(b64u(p));const[id,exp]=pl.split('|');if(id!==devId())return 'Cette clé est liée à un autre téléphone.';if(exp!=='illimite'&&new Date(exp+'T23:59:59')<new Date())return 'Clé expirée.';const key=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u(s),new TextEncoder().encode(pl));return ok?'':'Clé invalide.'}catch(e){return 'Clé invalide.'}}
function lock(msg){const id=devId();$.innerHTML=`<h1>🧵 Atelier Couture</h1><div class="card"><h2>Activation</h2><p class="mut">Envoyez ce code à l'éditeur pour recevoir votre clé d'activation.</p><div style="font:700 28px monospace;text-align:center;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:10px">${id}</div><a class="btn o big" style="display:block" href="https://wa.me/${OWNER_TEL}?text=${encodeURIComponent('Bonjour, voici mon code Atelier Couture : '+id)}" target="_blank">Envoyer mon code sur WhatsApp</a><label style="display:block;margin-top:14px">Votre clé d'activation</label><textarea id="kk" rows="4" placeholder="Collez la clé ici"></textarea>${msg?`<div style="color:#c0392b;margin-bottom:10px">${msg}</div>`:''}<button class="btn big" onclick="activate()">Activer</button></div>`}
async function activate(){const k=document.getElementById('kk').value;const m=await check(k);if(m){lock(m);return}try{localStorage.setItem('ac-key',k.trim())}catch(e){}render()}
async function gate(){let k='';try{k=localStorage.getItem('ac-key')||''}catch(e){}if(k&&!(await check(k))){render();return}lock('')}
gate();
</script></body></html>
